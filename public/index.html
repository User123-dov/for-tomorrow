<body data-base="dark" data-accent="cyan">
  <script>try{document.body.dataset.base=localStorage.getItem('yt_base')||'dark';document.body.dataset.accent=localStorage.getItem('yt_accent')||'cyan';}catch(e){}</script>
    <script>
window.__errs = [];
window.addEventListener('error', e => { window.__errs.push((e.message||'') + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno); });
window.addEventListener('unhandledrejection', e => { window.__errs.push('rej: ' + String(e.reason).slice(0,200)); });
</script>

  <script src="/vendor/vue.js"></script>
  <script type="module" src="/js/app.js"></script>
